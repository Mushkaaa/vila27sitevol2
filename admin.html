<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Objednávky · Vila 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --pine:#000000; --pine-2:#141414;
    --cream:#F5F4F0; --cream-2:#E4E2DC;
    --red:#BA2727; --honey:#FFFFFF; --ink:#1B1B1B; --soft:#A6A6A6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;
    background:var(--pine); color:var(--cream);
    min-height:100vh; padding:20px; line-height:1.5;
  }
  h1,h2{font-weight:900;letter-spacing:-.02em}

  .bar{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    max-width:1400px;margin:0 auto 22px;padding-bottom:16px;
    border-bottom:1px solid rgba(255,255,255,.18);
  }
  .bar h1{font-size:1.6rem;font-weight:900}
  .bar .spacer{flex:1}
  .stat{
    font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--soft);display:flex;align-items:center;gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--honey);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  button{
    font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer;
    padding:.6rem 1.1rem;border-radius:2px;border:1.5px solid rgba(255,255,255,.3);
    background:transparent;color:var(--cream);transition:background .15s,border-color .15s;
  }
  button:hover{background:rgba(255,255,255,.1)}
  button:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
  button.on{background:#fff;border-color:#fff;color:#000}

  /* --- gate --- */
  .gate{max-width:400px;margin:16vh auto;text-align:center}
  .gate h2{font-size:1.8rem;margin-bottom:8px}
  .gate p{color:var(--soft);font-size:.92rem;margin-bottom:22px}
  .gate input{
    width:100%;padding:.9rem 1rem;border-radius:2px;border:1.5px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.06);color:var(--cream);font-family:"JetBrains Mono",monospace;
    font-size:.95rem;margin-bottom:12px;
  }
  .gate input:focus{outline:none;border-color:var(--honey)}
  .gate button{width:100%;background:#fff;border-color:#fff;color:#000;padding:.9rem}
  .err{color:#F0B4A8;font-size:.85rem;margin-top:12px;min-height:1.2em}

  /* --- board --- */
  .board{
    max-width:1400px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;
  }
  .empty{grid-column:1/-1;text-align:center;padding:12vh 0;color:var(--soft)}
  .empty b{display:block;font-weight:900;font-size:1.5rem;color:var(--cream-2);margin-bottom:6px}

  /* bloček ako papierik */
  .ticket{
    background:var(--cream);color:var(--ink);border-radius:6px 6px 0 0;
    padding:18px 18px 26px;position:relative;
    box-shadow:0 20px 40px -24px rgba(0,0,0,.8);
    -webkit-mask-image:linear-gradient(#000 0 0), repeating-linear-gradient(135deg,#000 0 7px,transparent 7px 14px);
    mask-image:linear-gradient(#000 0 0), repeating-linear-gradient(135deg,#000 0 7px,transparent 7px 14px);
    -webkit-mask-size:100% calc(100% - 10px), 100% 10px;
    mask-size:100% calc(100% - 10px), 100% 10px;
    -webkit-mask-position:top left, bottom left;
    mask-position:top left, bottom left;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  }
  .ticket.fresh{animation:freshPulse 1.1s ease-in-out infinite}
  @keyframes freshPulse{
    0%,100%{box-shadow:0 0 0 3px var(--red),0 20px 40px -24px rgba(0,0,0,.8)}
    50%{box-shadow:0 0 0 8px var(--red),0 20px 40px -24px rgba(0,0,0,.8)}
  }
  @media (prefers-reduced-motion:reduce){
    .ticket.fresh{animation:none;box-shadow:0 0 0 5px var(--red),0 20px 40px -24px rgba(0,0,0,.8)}
  }

  /* --- upozornenie na novú objednávku (bez zvuku, len vizuálne) --- */
  .alert{
    position:fixed;left:0;right:0;top:0;z-index:100;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:20px 26px;box-shadow:0 14px 44px rgba(0,0,0,.7);
    animation:alertFlash 1.1s ease-in-out infinite;
  }
  @keyframes alertFlash{
    0%,49%{background:var(--red);color:#fff}
    50%,100%{background:#fff;color:var(--red)}
  }
  .alert .a-txt{font-size:1.9rem;font-weight:900;letter-spacing:-.02em;line-height:1}
  .alert .a-nums{font-family:"JetBrains Mono",monospace;font-size:1.35rem;font-weight:700}
  .alert button{
    margin-left:auto;background:var(--ink);border-color:var(--ink);color:#fff;
    font-size:1rem;padding:.85rem 1.8rem;
  }
  .alert button:hover{background:#000;border-color:#000}
  @media (prefers-reduced-motion:reduce){
    .alert{animation:none;background:var(--red);color:#fff}
  }

  .t-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:10px}
  .t-num{font-size:1.9rem;font-weight:900;line-height:1}
  .t-mode{
    font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    padding:.3rem .6rem;border-radius:4px;background:var(--ink);color:var(--cream);
  }
  .t-mode.odber{background:var(--red)}
  .t-time{margin-left:auto;font-size:.78rem;color:#6A5F5A;font-family:"JetBrains Mono",monospace}

  .t-cust{margin:12px 0}
  .t-cust b{font-size:1.05rem}
  .t-cust a{display:block;font-family:"JetBrains Mono",monospace;font-size:1rem;color:var(--red);text-decoration:none;font-weight:700}
  .t-addr{font-size:.9rem;margin-top:4px}
  .t-meta{font-size:.8rem;color:#6A5F5A;margin-top:6px}

  .t-items{
    border-top:1px dashed #B9AC9C;border-bottom:1px dashed #B9AC9C;
    padding:10px 0;margin:10px 0;font-family:"JetBrains Mono",monospace;font-size:.84rem;
  }
  .t-item{display:flex;gap:8px}
  .t-item .q{font-weight:700;min-width:2.2em}
  .t-item .n{flex:1}
  .t-item .p{font-weight:700}
  .t-extra{padding-left:2.2em;color:#6A5F5A;font-size:.78rem}

  .t-tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.25rem;align-items:baseline}
  .t-tot small{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6A5F5A}
  .t-sub{display:flex;justify-content:space-between;font-size:.8rem;color:#6A5F5A}

  .t-note{
    margin-top:12px;padding:10px;border-radius:2px;background:#E8E6E0;
    border-left:4px solid var(--ink);font-size:.88rem;
  }
  .t-note b{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}

  .t-status{
    position:absolute;top:14px;right:14px;font-size:.62rem;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;color:#8A7C74;
  }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <h2>Objednávky</h2>
  <p>Zadaj prístupový token, aby si videl príchodzie objednávky.</p>
  <input id="tok" type="password" placeholder="token" autocomplete="off" />
  <button id="enter">Zobraziť objednávky</button>
  <div class="err" id="err"></div>
</div>

<div id="app" hidden>
  <div id="alert" class="alert" role="alert" aria-live="assertive" hidden>
    <span class="a-txt">Nová objednávka</span>
    <span class="a-nums" id="alertNums"></span>
    <button id="alertOk">Prevzaté</button>
  </div>
  <div class="bar">
    <svg viewBox="10 5 160 100" style="height:28px;width:auto;fill:#fff" aria-hidden="true"><path d="M71.3,95H20.9l7.2-24.6c2.7-9.3,7.8-15.1,15.3-17.6c2.7-0.9,9.1-1.5,19.4-1.9c6.8-0.2,10.7-2.2,11.8-5.9l3.3-11.3 c1.3-4.5,0-6.8-3.8-6.8H40.7l3.3-11.5h32.5c5,0,8.8,1.5,11.4,4.5c2.6,3,3.2,6.9,1.8,11.8l-3.9,13.3c-2.4,8.4-7.3,13.6-14.6,15.6 c-1.3,0.4-7.7,0.9-19.2,1.6c-6.8,0.4-10.8,2.7-12.1,7l-4.1,14.1h38.8L71.3,95z"/><path d="M160.2,23.9c-0.1,1.6-5.2,12.9-15.3,33.9c-6,12.3-11.9,24.5-17.8,36.8h-12.6l32.7-68h-40l0.7-11.5h43.9 c2.6,0,4.6,0.8,6.3,2.5C159.6,19.1,160.3,21.2,160.2,23.9"/></svg><h1>Objednávky</h1>
    <span class="stat"><span class="dot"></span><span id="live">načítavam…</span></span>
    <span class="spacer"></span>
    <button id="notif">🖥 Upozornenia: vyp</button>
    <button id="sound">🔔 Zvuk: vyp</button>
    <button id="logout">Odhlásiť</button>
  </div>
  <div class="board" id="board"></div>
</div>

<script>
const KEY = "vila27_admin_token";
const NKEY = "vila27_admin_notif";
const TITLE = document.title;
const $ = s => document.querySelector(s);
let token = localStorage.getItem(KEY) || "";
let seen = new Set();        // všetko, čo už bolo vykreslené – slúži na detekciu nových
let unack = new Set();       // nové objednávky, ktoré obsluha ešte nepotvrdila
let newNums = [];            // ich čísla do pruhu hore
let orders = [], soundOn = false, notifOn = false, first = true, titleT = null;

const eur = n => (Number(n)||0).toFixed(2).replace(".", ",") + " €";
const cas = iso => { const d = new Date(iso), p = n => String(n).padStart(2,"0");
  return `${p(d.getHours())}:${p(d.getMinutes())}`; };
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime + t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .15);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .16);
    });
  }catch(e){}
}

/* Pruh hore bliká, kým ho obsluha nepotvrdí – zvuk sa nepoužíva, lebo výstup
   ide do reproduktorov v reštaurácii. */
function raiseAlert(fresh){
  fresh.forEach(o => { unack.add(o.id); newNums.push("#" + o.number); });
  $("#alertNums").textContent = newNums.join("  ");
  $("#alert").hidden = false;
  fitAlert();
  if(!titleT){
    let on = false;
    titleT = setInterval(() => {
      on = !on;
      document.title = on ? `🔴 NOVÁ OBJEDNÁVKA (${newNums.length})` : TITLE;
    }, 900);
  }
  try{ if(navigator.vibrate) navigator.vibrate([300, 120, 300]); }catch(e){}
  notify(fresh);
  if(soundOn) beep();
}

function clearAlert(){
  unack.clear(); newNums = [];
  $("#alert").hidden = true;
  fitAlert();
  clearInterval(titleT); titleT = null;
  document.title = TITLE;
  draw();
}

/* pruh je fixed, takže obsahu treba uvoľniť miesto presne podľa jeho výšky */
function fitAlert(){
  const a = $("#alert");
  document.body.style.paddingTop = a.hidden ? "" : (a.offsetHeight + 20) + "px";
}
addEventListener("resize", fitAlert);

/* systémové upozornenie – prebudí aj zakrytý prehliadač, zámerne bez zvuku */
function notify(fresh){
  if(!notifOn || !("Notification" in window) || Notification.permission !== "granted") return;
  fresh.forEach(o => {
    try{
      const n = new Notification(`Nová objednávka #${o.number}`, {
        body: `${o.mode === "odber" ? "Osobný odber" : "Rozvoz"} · ${eur(o.total)}\n${o.customer?.name || ""}`,
        tag: "vila27-" + o.id,
        requireInteraction: true,
        silent: true,
        icon: "favicon.svg"
      });
      n.onclick = () => { window.focus(); n.close(); };
    }catch(e){}
  });
}

function ticket(o){
  const items = (o.items||[]).map(it => `
    <div class="t-item"><span class="q">${it.qty}×</span><span class="n">${esc(it.name)}</span><span class="p">${eur(it.lineTotal)}</span></div>
    ${(it.extras||[]).map(x => `<div class="t-extra">+ ${esc(x)}</div>`).join("")}`).join("");

  return `<article class="ticket ${unack.has(o.id) ? "fresh" : ""}">
    <div class="t-head">
      <span class="t-num">#${o.number}</span>
      <span class="t-mode ${o.mode === "odber" ? "odber" : ""}">${o.mode === "odber" ? "Odber" : "Rozvoz"}</span>
      <span class="t-time">${cas(o.createdAt)}</span>
    </div>
    <div class="t-cust">
      <b>${esc(o.customer?.name)}</b>
      <a href="tel:${esc(o.customer?.phone).replace(/\s/g,"")}">${esc(o.customer?.phone)}</a>
      ${o.customer?.address ? `<div class="t-addr">📍 ${esc(o.customer.address)}</div>` : ""}
      <div class="t-meta">${esc(o.customer?.time)} · ${esc(o.customer?.pay)}</div>
    </div>
    <div class="t-items">${items}</div>
    <div class="t-sub"><span>Medzisúčet</span><span>${eur(o.subtotal)}</span></div>
    ${o.fee ? `<div class="t-sub"><span>Doprava</span><span>${eur(o.fee)}</span></div>` : ""}
    <div class="t-tot"><small>Spolu</small><span>${eur(o.total)}</span></div>
    ${o.customer?.note ? `<div class="t-note"><b>Poznámka</b>${esc(o.customer.note)}</div>` : ""}
  </article>`;
}

function draw(){
  $("#board").innerHTML = orders.length
    ? orders.map(ticket).join("")
    : `<div class="empty"><b>Zatiaľ nič</b>Nové objednávky sa tu objavia samé.</div>`;
}

async function load(){
  try{
    const res = await fetch(`/api/queue?token=${encodeURIComponent(token)}&all=1`);
    if(res.status === 401){ logout("Token neplatí."); return; }
    const data = await res.json();
    orders = data.orders || [];

    const fresh = orders.filter(o => !seen.has(o.id));
    orders.forEach(o => seen.add(o.id));
    if(fresh.length && !first) raiseAlert(fresh);

    draw();
    first = false;
    $("#live").textContent = `${orders.length} objednávok · ${new Date().toLocaleTimeString("sk-SK")}`;
  }catch(e){
    $("#live").textContent = "spojenie zlyhalo, skúšam znova…";
  }
}

function logout(msg){
  localStorage.removeItem(KEY); token = ""; seen = new Set(); orders = []; first = true;
  clearAlert();
  $("#app").hidden = true; $("#gate").hidden = false; $("#err").textContent = msg || "";
}

$("#enter").addEventListener("click", () => {
  const v = $("#tok").value.trim();
  if(!v){ $("#err").textContent = "Zadaj token."; return; }
  localStorage.setItem(KEY, v); token = v;
  $("#gate").hidden = true; $("#app").hidden = false;
  load();
});
$("#tok").addEventListener("keydown", e => { if(e.key === "Enter") $("#enter").click(); });
$("#logout").addEventListener("click", () => logout());
$("#sound").addEventListener("click", e => {
  soundOn = !soundOn;
  e.target.classList.toggle("on", soundOn);
  e.target.textContent = soundOn ? "🔔 Zvuk: zap" : "🔔 Zvuk: vyp";
  if(soundOn) beep();
});
$("#alertOk").addEventListener("click", clearAlert);

function paintNotif(){
  const b = $("#notif");
  b.classList.toggle("on", notifOn);
  b.textContent = notifOn ? "🖥 Upozornenia: zap" : "🖥 Upozornenia: vyp";
}
$("#notif").addEventListener("click", async e => {
  if(notifOn){ notifOn = false; localStorage.removeItem(NKEY); paintNotif(); return; }
  if(!("Notification" in window)){ e.target.textContent = "🖥 Upozornenia: nepodporované"; return; }
  let perm = Notification.permission;
  if(perm === "default") perm = await Notification.requestPermission();
  if(perm !== "granted"){ e.target.textContent = "🖥 Upozornenia: zakázané v prehliadači"; return; }
  notifOn = true; localStorage.setItem(NKEY, "1"); paintNotif();
});
if(localStorage.getItem(NKEY) === "1" && "Notification" in window && Notification.permission === "granted") notifOn = true;
paintNotif();

if(token){ $("#app").hidden = false; load(); } else { $("#gate").hidden = false; }
setInterval(() => { if(token && !$("#app").hidden) load(); }, 5000);
</script>
</body>
</html>
