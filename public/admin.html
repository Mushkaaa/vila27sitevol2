<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Správa · Vila 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#14110F; --ink-2:#232020; --rule:#332F2D;
    --paper:#F5F4F0; --muted:#8C8681; --accent:#BA2727;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;
    background:var(--ink); color:var(--paper);
    min-height:100vh; line-height:1.45;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .obal{width:100%;max-width:720px}
  .znacka{display:flex;align-items:center;gap:14px;margin-bottom:34px}
  .znacka svg{height:32px;width:auto;fill:var(--paper)}
  .znacka span{font-size:.76rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  .volby{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .volba{
    display:block;text-decoration:none;color:var(--paper);
    border:1.5px solid var(--rule);border-radius:3px;padding:26px 22px 22px;
    transition:background .12s,border-color .12s;
  }
  .volba:hover,.volba:focus-visible{background:var(--ink-2);border-color:var(--paper);outline:none}
  .volba h2{font-size:1.35rem;font-weight:900;letter-spacing:-.01em;margin-bottom:6px}
  .volba p{color:var(--muted);font-size:.92rem}
  .volba .kto{
    display:inline-block;margin-top:16px;font-size:.66rem;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--rule);border-radius:2px;padding:.2rem .5rem;
  }
  .volba:hover .kto{border-color:var(--muted)}

  .pata{margin-top:26px;font-size:.84rem;color:var(--muted)}
  .pata a{color:var(--paper)}

  @media (max-width:620px){
    .volby{grid-template-columns:1fr}
    .volba{padding:20px}
  }
</style>
</head>
<body>
<div class="obal">
  <div class="znacka">
    <svg viewBox="10 5 160 100" aria-label="Vila 27"><path d="M71.3,95H20.9l7.2-24.6c2.7-9.3,7.8-15.1,15.3-17.6c2.7-0.9,9.1-1.5,19.4-1.9c6.8-0.2,10.7-2.2,11.8-5.9l3.3-11.3 c1.3-4.5,0-6.8-3.8-6.8H40.7l3.3-11.5h32.5c5,0,8.8,1.5,11.4,4.5c2.6,3,3.2,6.9,1.8,11.8l-3.9,13.3c-2.4,8.4-7.3,13.6-14.6,15.6 c-1.3,0.4-7.7,0.9-19.2,1.6c-6.8,0.4-10.8,2.7-12.1,7l-4.1,14.1h38.8L71.3,95z"/><path d="M160.2,23.9c-0.1,1.6-5.2,12.9-15.3,33.9c-6,12.3-11.9,24.5-17.8,36.8h-12.6l32.7-68h-40l0.7-11.5h43.9 c2.6,0,4.6,0.8,6.3,2.5C159.6,19.1,160.3,21.2,160.2,23.9"/></svg>
    <span>Správa</span>
  </div>

  <div class="volby">
    <a class="volba" href="/admin-objednavky">
      <h2>Objednávky</h2>
      <p>Nástenka s príchodzími objednávkami. Sama sa obnovuje, upozorní na novú a označuje sa na nej, čo je vybavené.</p>
      <span class="kto">pre obsluhu</span>
    </a>
    <a class="volba" href="/admin-produkty">
      <h2>Správa ponuky</h2>
      <p>Pridávanie a úprava jedál a nápojov, ceny, gramáž, alergény a zapínanie či vypínanie produktov.</p>
      <span class="kto">pre majiteľa</span>
    </a>
  </div>

  <p class="pata">Späť na <a href="/">vila27.sk</a></p>
</div>
</body>
</html>
