<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Objednávky · Vila 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#14110F;          /* takmer čierna, do teplého */
    --ink-2:#232020;
    --rule:#332F2D;
    --paper:#F5F4F0;        /* teplá špinavo-biela */
    --paper-2:#E6E3DC;
    --muted:#8C8681;
    --accent:#BA2727;       /* jediná farba, ktorá niečo znamená: nové a naliehavé */
    --tap:44px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;
    background:var(--ink); color:var(--paper);
    min-height:100vh; line-height:1.45; font-size:16px;
  }
  button{font-family:inherit;cursor:pointer;border:1.5px solid transparent;border-radius:3px}
  button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

  /* ---------- horná lišta ---------- */
  .bar{
    position:sticky;top:0;z-index:40;background:var(--ink);
    border-bottom:1px solid var(--rule);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:12px 20px;
  }
  .bar .logo{height:26px;width:auto;fill:var(--paper);flex:none}
  .bar h1{
    font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);flex:none;
  }
  .spacer{flex:1}

  /* počty podľa stavu – zároveň fungujú ako filter */
  .tally{display:flex;gap:2px;flex:none}
  .tally button{
    background:transparent;color:var(--muted);border-color:var(--rule);
    padding:.4rem .8rem;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    display:flex;align-items:baseline;gap:7px;min-height:36px;
  }
  .tally button b{font-size:1.05rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--paper)}
  .tally button:hover{background:var(--ink-2)}
  .tally button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .tally button.on b{color:var(--ink)}
  .tally button.nove b{color:var(--accent)}
  .tally button.on.nove b{color:var(--accent)}

  .tools{display:flex;gap:8px;flex:none}
  .tools button{
    background:transparent;color:var(--paper);border-color:var(--rule);
    padding:.4rem .8rem;font-size:.8rem;font-weight:600;min-height:36px;
  }
  .tools button:hover{background:var(--ink-2)}
  .tools button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .tool-odkaz{
    display:inline-flex;align-items:center;color:var(--paper);text-decoration:none;
    border:1.5px solid var(--rule);border-radius:3px;
    padding:.4rem .8rem;font-size:.8rem;font-weight:600;min-height:36px;
  }
  .tool-odkaz:hover{background:var(--ink-2)}

  .live{
    font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;
    display:flex;align-items:center;gap:7px;flex:none;
  }
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--paper);animation:tep 2.4s infinite}
  .live.off .dot{background:var(--accent);animation:none}
  @keyframes tep{0%,100%{opacity:1}50%{opacity:.2}}
  .hint{flex-basis:100%;font-size:.8rem;color:#E9A79B;line-height:1.4}

  /* ---------- prihlásenie ---------- */
  .gate{max-width:380px;margin:14vh auto;padding:0 20px}
  .gate svg{height:34px;width:auto;fill:var(--paper);display:block;margin-bottom:26px}
  .gate h2{font-size:1.5rem;font-weight:900;letter-spacing:-.01em;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:.92rem;margin-bottom:20px}
  .gate input{
    width:100%;padding:.85rem .9rem;border:1.5px solid var(--rule);border-radius:3px;
    background:var(--ink-2);color:var(--paper);font-family:"JetBrains Mono",monospace;font-size:.95rem;
  }
  .gate input:focus{outline:none;border-color:var(--paper)}
  .gate button{
    width:100%;margin-top:10px;padding:.85rem;background:var(--paper);color:var(--ink);
    border-color:var(--paper);font-size:.95rem;font-weight:700;
  }
  .err{color:#E9A79B;font-size:.86rem;margin-top:12px;min-height:1.2em}
  .spat-odkaz{margin-top:18px;font-size:.86rem}
  .spat-odkaz a{color:var(--muted)}

  /* ---------- nástenka ---------- */
  .board{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:14px;padding:16px 20px 80px;align-items:start;
  }
  .empty{grid-column:1/-1;text-align:left;padding:10vh 0;color:var(--muted)}
  .empty b{display:block;font-weight:900;font-size:1.3rem;color:var(--paper-2);margin-bottom:4px}
  .pasmo{
    grid-column:1/-1;color:var(--muted);font-size:.86rem;
    border-left:3px solid var(--rule);padding:2px 0 2px 12px;margin-bottom:2px;
  }

  .oznam{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:70;
    background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:3px;
    font-size:.92rem;font-weight:600;max-width:calc(100% - 40px);
    opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility 0s .18s;
  }
  .oznam.show{opacity:1;transform:translate(-50%,0);visibility:visible;transition:opacity .18s,transform .18s}

  .card{
    background:var(--paper);color:var(--ink);border-radius:3px;
    border-left:6px solid var(--muted);overflow:hidden;
  }
  .card.nova{border-left-color:var(--accent)}
  .card.vytlacena{border-left-color:var(--ink)}
  .card.hotova{opacity:.5;border-left-color:var(--paper-2)}
  .card.hotova:hover{opacity:1}
  .card.nevidena{animation:bliknutie 1.1s ease-in-out infinite}
  @keyframes bliknutie{
    0%,100%{box-shadow:0 0 0 0 var(--accent)}
    50%{box-shadow:0 0 0 5px var(--accent)}
  }

  /* hlavička: číslo a vek objednávky ako prvé */
  .c-top{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:2px solid var(--ink)}
  .c-num{font-size:2.1rem;font-weight:900;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .card.nova .c-num{color:var(--accent)}
  .c-mode{
    font-size:.64rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    padding:.25rem .5rem;border-radius:2px;background:var(--ink);color:var(--paper);
  }
  .c-mode.odber{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .c-age{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
  .c-age .rel{display:block;font-size:.95rem;font-weight:700}
  .c-age .abs{display:block;font-size:.72rem;color:#6F6862;font-family:"JetBrains Mono",monospace}
  .c-age.stara .rel{color:var(--accent)}

  /* jedlo – hlavná informácia, monospace kvôli zarovnaniu počtov */
  .c-items{padding:10px 14px;font-family:"JetBrains Mono",monospace}
  .c-item{display:flex;gap:9px;padding:3px 0;font-size:.95rem;line-height:1.35}
  .c-item .q{font-weight:700;min-width:2.1em;flex:none}
  .c-item .n{flex:1;font-weight:700}
  .c-extra{padding-left:calc(2.1em + 9px);color:#6F6862;font-size:.82rem;line-height:1.3}

  /* kontakt a doručenie – až za jedlom */
  .c-who{padding:10px 14px;border-top:1px dashed #C3BBB1;font-size:.9rem}
  .c-who b{font-size:1rem}
  .c-who a{
    display:inline-block;font-family:"JetBrains Mono",monospace;font-size:1.05rem;font-weight:700;
    color:var(--accent);text-decoration:none;margin-top:1px;
  }
  .c-addr{margin-top:4px;font-weight:600}
  .c-meta{margin-top:3px;color:#6F6862;font-size:.82rem}
  .c-sum{margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums}

  .c-note{
    margin:0 14px 12px;padding:8px 10px;background:var(--ink);color:var(--paper);border-radius:2px;font-size:.9rem;
  }
  .c-note b{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}

  .c-act{display:flex;gap:8px;padding:0 14px 12px}
  .c-act button{flex:1;min-height:var(--tap);font-size:.9rem;font-weight:700}
  .b-videl{background:var(--accent);border-color:var(--accent);color:#fff}
  .b-videl:hover{background:#961F1F;border-color:#961F1F}
  .b-hotove{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .b-hotove:hover{background:#000}
  .b-vratit{background:transparent;border-color:#C3BBB1;color:#6F6862}
  .b-vratit:hover{background:var(--paper-2)}
  .c-stav{
    padding:0 14px 10px;font-size:.66rem;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:#8A817A;
  }

  /* ---------- pruh pri novej objednávke ---------- */
  .alert{
    position:fixed;left:0;right:0;top:0;z-index:60;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:16px 20px;box-shadow:0 12px 40px rgba(0,0,0,.6);
    animation:pruh 1.1s ease-in-out infinite;
  }
  @keyframes pruh{
    0%,49%{background:var(--accent);color:#fff}
    50%,100%{background:var(--paper);color:var(--accent)}
  }
  .alert .a-txt{font-size:1.5rem;font-weight:900;letter-spacing:-.02em;line-height:1}
  .alert .a-nums{font-family:"JetBrains Mono",monospace;font-size:1.2rem;font-weight:700}

  @media (prefers-reduced-motion:reduce){
    .alert{animation:none;background:var(--accent);color:#fff}
    .card.nevidena{animation:none;box-shadow:0 0 0 4px var(--accent)}
    .live .dot{animation:none}
  }

  /* ---------- menší displej / telefón ---------- */
  @media (max-width:760px){
    .bar{padding:10px 14px;gap:12px}
    .bar h1{display:none}
    .tally{order:3;flex-basis:100%}
    .tally button{flex:1;justify-content:center;padding:.45rem .4rem}
    .board{grid-template-columns:1fr;padding:12px 14px 60px;gap:12px}
    .c-num{font-size:2.4rem}
    .c-item{font-size:1rem}
  }
  /* veľký displej v kuchyni – čitateľnosť na dĺžku ruky */
  @media (min-width:1600px){
    body{font-size:17px}
    .board{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
  }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <svg viewBox="10 5 160 100" aria-label="Vila 27"><path d="M71.3,95H20.9l7.2-24.6c2.7-9.3,7.8-15.1,15.3-17.6c2.7-0.9,9.1-1.5,19.4-1.9c6.8-0.2,10.7-2.2,11.8-5.9l3.3-11.3 c1.3-4.5,0-6.8-3.8-6.8H40.7l3.3-11.5h32.5c5,0,8.8,1.5,11.4,4.5c2.6,3,3.2,6.9,1.8,11.8l-3.9,13.3c-2.4,8.4-7.3,13.6-14.6,15.6 c-1.3,0.4-7.7,0.9-19.2,1.6c-6.8,0.4-10.8,2.7-12.1,7l-4.1,14.1h38.8L71.3,95z"/><path d="M160.2,23.9c-0.1,1.6-5.2,12.9-15.3,33.9c-6,12.3-11.9,24.5-17.8,36.8h-12.6l32.7-68h-40l0.7-11.5h43.9 c2.6,0,4.6,0.8,6.3,2.5C159.6,19.1,160.3,21.2,160.2,23.9"/></svg>
  <h2>Objednávky</h2>
  <p>Zadajte prístupový kód, ktorý máte na obsluhu.</p>
  <input id="tok" type="password" placeholder="prístupový kód" autocomplete="off" />
  <button id="enter">Zobraziť objednávky</button>
  <div class="err" id="err"></div>
  <p class="spat-odkaz"><a href="/admin">Späť na výber</a></p>
</div>

<div id="app" hidden>
  <div id="alert" class="alert" role="alert" aria-live="assertive" hidden>
    <span class="a-txt">Nová objednávka</span>
    <span class="a-nums" id="alertNums"></span>
  </div>

  <div class="bar">
    <svg class="logo" viewBox="10 5 160 100" aria-label="Vila 27"><path d="M71.3,95H20.9l7.2-24.6c2.7-9.3,7.8-15.1,15.3-17.6c2.7-0.9,9.1-1.5,19.4-1.9c6.8-0.2,10.7-2.2,11.8-5.9l3.3-11.3 c1.3-4.5,0-6.8-3.8-6.8H40.7l3.3-11.5h32.5c5,0,8.8,1.5,11.4,4.5c2.6,3,3.2,6.9,1.8,11.8l-3.9,13.3c-2.4,8.4-7.3,13.6-14.6,15.6 c-1.3,0.4-7.7,0.9-19.2,1.6c-6.8,0.4-10.8,2.7-12.1,7l-4.1,14.1h38.8L71.3,95z"/><path d="M160.2,23.9c-0.1,1.6-5.2,12.9-15.3,33.9c-6,12.3-11.9,24.5-17.8,36.8h-12.6l32.7-68h-40l0.7-11.5h43.9 c2.6,0,4.6,0.8,6.3,2.5C159.6,19.1,160.3,21.2,160.2,23.9"/></svg>
    <h1>Objednávky</h1>
    <div class="tally" role="group" aria-label="Filter podľa stavu">
      <button type="button" class="nove on" data-filter="nove"><b id="nNove">0</b> nové</button>
      <button type="button" data-filter="vytlacene"><b id="nVytlacene">0</b> vytlačené</button>
      <button type="button" data-filter="hotove"><b id="nHotove">0</b> hotové</button>
      <button type="button" data-filter="vsetky"><b id="nVsetky">0</b> všetky</button>
    </div>
    <span class="spacer"></span>
    <span class="live" id="liveBox"><span class="dot"></span><span id="live">načítavam…</span></span>
    <div class="tools">
      <button type="button" id="notif">Upozornenia: vyp</button>
      <button type="button" id="sound">Zvuk: vyp</button>
      <a class="tool-odkaz" href="/admin-produkty">Správa ponuky</a>
      <button type="button" id="logout">Odhlásiť</button>
    </div>
    <span class="hint" id="notifHint" hidden></span>
  </div>

  <div class="board" id="board"></div>
</div>

<div class="oznam" id="oznam" role="status" aria-live="polite"></div>

<script>
const KEY = "vila27_admin_token";
const NKEY = "vila27_admin_notif";
const FKEY = "vila27_admin_filter";
const TITLE = document.title;
const $ = s => document.querySelector(s);

let token = localStorage.getItem(KEY) || "";
let orders = [], printed = new Set(), hotove = new Set();
let seen = new Set();            // čo už nástenka niekedy zobrazila – na detekciu nových
let unack = new Set();           // nové, ktoré obsluha ešte nepotvrdila
let filter = localStorage.getItem(FKEY) || "vsetky";   // nič sa neskrýva, kým si obsluha nevyberie
let soundOn = false, notifOn = false, first = true, titleT = null, actx = null;

const eur = n => (Number(n) || 0).toFixed(2).replace(".", ",") + " €";
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const cas = iso => { const d = new Date(iso), p = n => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; };

/* Vek objednávky sa číta rýchlejšie ako hodiny – stará objednávka tak bije do očí. */
function vek(iso){
  const min = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return "teraz";
  if (min < 60) return "pred " + min + " min";
  const h = Math.floor(min / 60), z = min % 60;
  return "pred " + h + " h" + (z ? " " + z + " min" : "");
}
const stara = iso => (Date.now() - new Date(iso).getTime()) > 20 * 60000;

const stav = o => hotove.has(o.id) ? "hotova" : (printed.has(o.id) ? "vytlacena" : "nova");
const POPIS = { nova: "čaká na tlač", vytlacena: "vytlačená v kuchyni", hotova: "vybavená" };

/* Dvojité pípnutie: dva oddelené tóny. Jeden audio kontext na celú stránku –
   prehliadač ich viac ako pár nepovolí. */
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    [[0, 880], [.26, 1175]].forEach(([t, hz]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = hz;
      o.connect(g); g.connect(actx.destination);
      const at = actx.currentTime + t;
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(.3, at + .012);
      g.gain.setValueAtTime(.3, at + .15);
      g.gain.exponentialRampToValueAtTime(.0001, at + .2);
      o.start(at); o.stop(at + .21);
    });
  }catch(e){}
}

/* ---------- upozornenie na novú objednávku ---------- */
function raiseAlert(fresh){
  fresh.forEach(o => unack.add(o.id));
  refreshAlert();
  try{ if (navigator.vibrate) navigator.vibrate([300, 120, 300]); }catch(e){}
  notify(fresh);
  if (soundOn) beep();
}

function refreshAlert(){
  const nums = orders.filter(o => unack.has(o.id)).map(o => "#" + o.number);
  const on = unack.size > 0;
  $("#alertNums").textContent = nums.join("  ");
  $("#alert").hidden = !on;
  document.body.style.paddingTop = on ? ($("#alert").offsetHeight + 4) + "px" : "";

  if (on && !titleT){
    let flip = false;
    titleT = setInterval(() => {
      flip = !flip;
      document.title = flip ? `NOVÁ OBJEDNÁVKA (${unack.size})` : TITLE;
    }, 900);
  }
  if (!on && titleT){ clearInterval(titleT); titleT = null; document.title = TITLE; }
}
addEventListener("resize", refreshAlert);

function ack(id){
  if (!unack.delete(id)) return;
  refreshAlert(); draw();
}
function clearAlert(){ unack.clear(); refreshAlert(); draw(); }

/* Systémové okienko – prebudí aj zakrytý prehliadač. Zámerne bez zvuku,
   reproduktory na počítači idú do reštaurácie. */
function notify(fresh){
  if (!notifOn || !("Notification" in window) || Notification.permission !== "granted") return;
  fresh.forEach(o => {
    try{
      const n = new Notification(`Nová objednávka #${o.number}`, {
        body: `${o.mode === "odber" ? "Osobný odber" : "Rozvoz"} · ${eur(o.total)}\n${o.customer?.name || ""}`,
        tag: "vila27-" + o.id, requireInteraction: true, silent: true, icon: "favicon.svg",
      });
      n.onclick = () => { window.focus(); n.close(); };
    }catch(e){}
  });
}

/* ---------- vykreslenie ---------- */
function card(o){
  const s = stav(o);
  const nevidena = unack.has(o.id);

  const items = (o.items || []).map(it => `
    <div class="c-item"><span class="q">${it.qty}×</span><span class="n">${esc(it.name)}</span></div>
    ${(it.extras || []).map(x => `<div class="c-extra">+ ${esc(x)}</div>`).join("")}`).join("");

  const akcie = s === "hotova"
    ? `<button type="button" class="b-vratit" data-vrat="${esc(o.id)}">Vrátiť medzi rozrobené</button>`
    : (nevidena ? `<button type="button" class="b-videl" data-ack="${esc(o.id)}">Videl som</button>` : "") +
      `<button type="button" class="b-hotove" data-hotovo="${esc(o.id)}">Hotové</button>`;

  return `<article class="card ${s}${nevidena ? " nevidena" : ""}">
    <div class="c-top">
      <span class="c-num">#${o.number}</span>
      <span class="c-mode ${o.mode === "odber" ? "odber" : ""}">${o.mode === "odber" ? "Odber" : "Rozvoz"}</span>
      <span class="c-age ${stara(o.createdAt) && s !== "hotova" ? "stara" : ""}">
        <span class="rel">${vek(o.createdAt)}</span><span class="abs">${cas(o.createdAt)}</span>
      </span>
    </div>
    <div class="c-items">${items}</div>
    <div class="c-who">
      <b>${esc(o.customer?.name)}</b><br />
      <a href="tel:${esc(o.customer?.phone).replace(/\s/g, "")}">${esc(o.customer?.phone)}</a>
      ${o.customer?.address ? `<div class="c-addr">${esc(o.customer.address)}</div>` : ""}
      <div class="c-meta">${esc(o.customer?.time)} · ${esc(o.customer?.pay)}</div>
      <div class="c-sum">${eur(o.total)}${o.fee ? ` <span class="c-meta">(z toho doprava ${eur(o.fee)})</span>` : ""}</div>
    </div>
    ${o.customer?.note ? `<div class="c-note"><b>Poznámka</b>${esc(o.customer.note)}</div>` : ""}
    <div class="c-stav">${POPIS[s]}</div>
    <div class="c-act">${akcie}</div>
  </article>`;
}

function draw(){
  const vsetky = orders;
  const podla = {
    nove: vsetky.filter(o => stav(o) === "nova"),
    vytlacene: vsetky.filter(o => stav(o) === "vytlacena"),
    hotove: vsetky.filter(o => stav(o) === "hotova"),
    vsetky,
  };
  $("#nNove").textContent = podla.nove.length;
  $("#nVytlacene").textContent = podla.vytlacene.length;
  $("#nHotove").textContent = podla.hotove.length;
  $("#nVsetky").textContent = vsetky.length;
  document.querySelectorAll(".tally button").forEach(b => b.classList.toggle("on", b.dataset.filter === filter));

  const zoznam = podla[filter] || vsetky;
  const uvod = filter === "hotove"
    ? '<p class="pasmo">Archív vybavených objednávok. Nástenka drží posledných 60 objednávok, staršie sa už nezobrazujú.</p>'
    : "";
  const prazdne = {
    nove: "Všetko je vybavené. Nová objednávka sa tu objaví sama.",
    vytlacene: "Nič nečaká na výdaj.",
    hotove: "Zatiaľ nie je nič označené ako vybavené.",
    vsetky: "Nové objednávky sa tu objavia samé.",
  };
  $("#board").innerHTML = uvod + (zoznam.length
    ? zoznam.map(card).join("")
    : `<div class="empty"><b>Nič tu nie je</b>${prazdne[filter] || prazdne.vsetky}</div>`);
}

let oznamT;
function oznam(text){
  const t = $("#oznam");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(oznamT);
  oznamT = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ---------- načítanie ---------- */
async function load(){
  try{
    const res = await fetch(`/api/queue?token=${encodeURIComponent(token)}&all=1`);
    if (res.status === 401){ logout("Prístupový kód neplatí."); return; }
    const data = await res.json();
    orders = data.orders || [];
    printed = new Set(data.printed || []);
    hotove = new Set(data.hotove || []);

    // vybavenú objednávku netreba ohlasovať – mohol ju medzitým zavrieť kolega
    const fresh = orders.filter(o => !seen.has(o.id) && !hotove.has(o.id));
    orders.forEach(o => seen.add(o.id));

    // pruh smie svietiť len za objednávku, ktorá je stále v zozname a nie je vybavená
    const su = new Set(orders.map(o => o.id));
    unack.forEach(id => { if (!su.has(id) || hotove.has(id)) unack.delete(id); });

    if (fresh.length && !first) raiseAlert(fresh);
    else refreshAlert();

    draw();
    first = false;
    $("#liveBox").classList.remove("off");
    $("#live").textContent = "obnovené " + new Date().toLocaleTimeString("sk-SK");
  }catch(e){
    $("#liveBox").classList.add("off");
    $("#live").textContent = "bez spojenia, skúšam znova…";
  }
}

async function oznacHotove(id, hotova){
  try{
    const res = await fetch("/api/queue", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ token, hotove: [id], stav: hotova }),
    });
    if (res.status === 401){ logout("Prístupový kód neplatí."); return; }
    if (hotova) hotove.add(id); else hotove.delete(id);
    unack.delete(id);
    refreshAlert(); draw();

    const o = orders.find(x => x.id === id);
    const cislo = o ? "#" + o.number : "Objednávka";
    if (hotova) oznam(`${cislo} je vybavená. Nájdete ju pod Hotové.`);
    else oznam(`${cislo} je späť medzi rozrobenými.`);
  }catch(e){
    $("#liveBox").classList.add("off");
    $("#live").textContent = "zmenu sa nepodarilo uložiť";
  }
}

function logout(msg){
  localStorage.removeItem(KEY); token = "";
  orders = []; seen = new Set(); printed = new Set(); hotove = new Set(); first = true;
  clearAlert();
  $("#app").hidden = true; $("#gate").hidden = false; $("#err").textContent = msg || "";
}

/* ---------- ovládanie ---------- */
$("#enter").addEventListener("click", () => {
  const v = $("#tok").value.trim();
  if (!v){ $("#err").textContent = "Zadajte prístupový kód."; return; }
  localStorage.setItem(KEY, v); token = v;
  $("#gate").hidden = true; $("#app").hidden = false;
  askPermission();
  load();
});
$("#tok").addEventListener("keydown", e => { if (e.key === "Enter") $("#enter").click(); });
$("#logout").addEventListener("click", () => logout());

$("#sound").addEventListener("click", e => {
  soundOn = !soundOn;
  e.target.classList.toggle("on", soundOn);
  e.target.textContent = soundOn ? "Zvuk: zap" : "Zvuk: vyp";
  if (soundOn) beep();
});

document.querySelector(".tally").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]");
  if (!b) return;
  filter = b.dataset.filter;
  localStorage.setItem(FKEY, filter);
  draw();
});

$("#board").addEventListener("click", e => {
  const videl = e.target.closest("[data-ack]");
  if (videl){ ack(videl.dataset.ack); return; }
  const hotovo = e.target.closest("[data-hotovo]");
  if (hotovo){ oznacHotove(hotovo.dataset.hotovo, true); return; }
  const vrat = e.target.closest("[data-vrat]");
  if (vrat){ oznacHotove(vrat.dataset.vrat, false); }
});

/* Prepínač sa dá vždy prepnúť. Keď systémové okienko blokuje prehliadač,
   voľba sa aj tak uloží a pod lištou sa ukáže, čo s tým. */
function paintNotif(){
  $("#notif").classList.toggle("on", notifOn);
  $("#notif").textContent = notifOn ? "Upozornenia: zap" : "Upozornenia: vyp";
  const hint = $("#notifHint");
  let msg = "";
  if (notifOn && !("Notification" in window)){
    msg = "Systémové okienka tento prehliadač nevie zobraziť. Blikajúci pruh hore funguje aj tak.";
  }else if (notifOn && Notification.permission === "denied"){
    msg = "Systémové okienka blokuje prehliadač – povoľte ich cez ikonu vedľa adresy a stránku obnovte. Blikajúci pruh hore funguje aj tak.";
  }
  hint.textContent = msg;
  hint.hidden = !msg;
}
$("#notif").addEventListener("click", async () => {
  notifOn = !notifOn;
  localStorage.setItem(NKEY, notifOn ? "1" : "0");
  if (notifOn) await askPermission();
  paintNotif();
});

/* Povolenie musí dať človek, kódom sa nastaviť nedá – pýtame si ho hneď po
   otvorení nástenky. Firefox a Safari to dovolia len po kliknutí, preto je
   pripravená aj náhrada na prvý klik kdekoľvek na stránke. */
async function askPermission(){
  if (!("Notification" in window) || Notification.permission !== "default") return;
  try{ await Notification.requestPermission(); }catch(e){}
  paintNotif();
}
function armPermissionAsk(){
  if (!("Notification" in window) || Notification.permission !== "default") return;
  const once = () => { document.removeEventListener("click", once); askPermission(); };
  document.addEventListener("click", once);
}

notifOn = localStorage.getItem(NKEY) !== "0";
paintNotif();

if (token){
  $("#app").hidden = false;
  askPermission(); armPermissionAsk();
  load();
} else {
  $("#gate").hidden = false;
}
setInterval(() => { if (token && !$("#app").hidden) load(); }, 5000);
setInterval(() => { if (token && !$("#app").hidden && orders.length) draw(); }, 30000);
</script>
